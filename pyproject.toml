[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morphomesh"
version = "0.1.0"
description = "MorphoMesh: Automated AI 3D Creature Generation Pipeline & MCP Server for Blender and Google Antigravity 2.0"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "MorphoMesh Core Architecture Team", email = "core@morphomesh.io" }
]
license = { text = "Apache-2.0" }
keywords = ["mcp", "fastmcp", "blender", "creature-generation", "3d", "antigravity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
morphomesh = "morphomesh.main:main"
morphomesh-server = "morphomesh.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["m1_stress_harness"]
addopts = "--ignore=tests/m1_stress_harness"
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "unit: Isolated fast unit tests (<100ms)",
    "integration: End-to-end multi-component tests",
    "live_blender: marks tests requiring live Blender runtime",
    "adversarial: Stress testing, fuzzing, and AST attack injection suites",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
